[project]
name = "legacylift-backend"
version = "0.1.0"
description = "LegacyLift backend: legacy data discovery, mapping, migration and reconciliation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "slowapi>=0.1.10",
    "cryptography>=50.0.2",
    "python-multipart>=0.0.32",
    "pandas>=3.0.6",
    "pandera>=0.34.1",
    "sentence-transformers>=6.1.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
