# Services: db and redis always; the api and the worker with `docker compose --profile app up`; the REA runner with
# `--profile rea`.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legacylift}
      POSTGRES_USER: ${POSTGRES_USER:-legacylift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-owner}
    ports:
      - "${POSTGRES_HOST_PORT:-5544}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &app_env
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-legacylift_app}:${APP_DB_PASSWORD:-change-me-app}@db:5432/${POSTGRES_DB:-legacylift}
      REDIS_URL: redis://redis:6379/0
      JOBS_EXECUTION: celery
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "worker", "-Q", "legacylift", "--loglevel=INFO", "--concurrency=2"]
    environment: *app_env
    volumes:
      - uploads:/data/uploads
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  # The site and the console, served by nginx, which also forwards /api to the api service. Open http://localhost:8080
  frontend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Schedules the nightly metrics snapshot and the monthly invoice run. Exactly one instance should run.
  beat:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *app_env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Static analysis sandbox for uploaded software. Started on demand: docker compose --profile rea up
  rea-runner:
    profiles: ["rea"]
    image: legacylift-rea-runner:6.7.0
    build: ./rea-runner
    user: "10001:10001"
    read_only: true
    network_mode: none          # no internet and no access to the database
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    volumes:
      - uploads_decrypted:/uploads:ro    # read only mount of files prepared for analysis
    environment:
      REA_TIMEOUT_SECONDS: "120"

volumes:
  db_data:
  uploads:
  uploads_decrypted:
